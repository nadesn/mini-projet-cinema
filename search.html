<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinéma - Recherche</title>
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">🎬 Cinéma du Village</a>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="search.html">Rechercher</a>
    </nav>
  </header>

  <main class="container">
    <h1>Rechercher un film</h1>

    <input
      type="search"
      id="search-input"
      class="search-input"
      placeholder="Ex : Guardians of the Galaxy"
      autocomplete="off"
      autofocus
    >
    <p id="message" class="message">Tapez le titre d'un film (en anglais).</p>

    <div id="results" class="movie-grid"></div>
    <button id="load-more" class="btn btn--center" hidden>Charger plus de résultats</button>
  </main>

  <script type="module" src="/src/search.js"></script>
</body>
</html>
